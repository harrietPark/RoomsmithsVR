<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windups Lab</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d22; --soft: #6b6b76; --line: #e4e2dc; --accent: #5b6cff;
    --you: #1d1d22; --warn: #c0392b; --chip: #efeee9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 14px; padding: 14px 16px; height: calc(100vh - 58px); }
  section, aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; }
  section { display: flex; flex-direction: column; overflow: hidden; }
  aside { display: flex; flex-direction: column; overflow: auto; padding: 14px; gap: 14px; }
  .hint { color: var(--soft); font-size: 13px; padding: 8px 16px 0; }
  /* The desk: the team on an arc around "나". */
  .desk { position: relative; height: 230px; flex: none; border-bottom: 1px solid var(--line); background: radial-gradient(ellipse at 50% 100%, #fbfaf7 0%, #f1efe9 70%); }
  .agent { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; user-select: none; }
  .agent .body { width: 44px; height: 56px; border-radius: 22px 22px 18px 18px; box-shadow: inset -6px -6px 0 rgba(0,0,0,.12); transition: transform .2s; }
  .agent .name { font-size: 12px; font-weight: 600; background: #fff; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); }
  .agent.speaking .body { animation: bob .5s ease-in-out infinite alternate; }
  .agent.thinking .body { animation: wobble .25s ease-in-out infinite alternate; }
  .agent.addressed .name { background: var(--ink); color: #fff; }
  .agent.drop .body { transform: scale(1.15); outline: 3px solid var(--accent); }
  @keyframes bob { to { transform: translateY(-7px); } }
  @keyframes wobble { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .me { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; color: var(--soft); }
  .bubble { position: absolute; max-width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; font-size: 13.5px; box-shadow: 0 4px 14px rgba(0,0,0,.07); transform: translate(-50%, -100%); pointer-events: none; transition: opacity .3s; }
  .deskcard { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); width: 150px; background: #fff; border: 1.5px solid #cfcde6; border-radius: 10px; padding: 6px 8px; font-size: 12px; cursor: grab; box-shadow: 0 3px 10px rgba(0,0,0,.08); text-align: center; touch-action: none; }
  .deskcard b { display: block; font-size: 12.5px; }
  .log { flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }
  .line { display: flex; gap: 8px; align-items: flex-start; max-width: 92%; }
  .line .who { flex: none; font-size: 12px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 8px; margin-top: 2px; }
  .line.you { align-self: flex-end; }
  .line.you .text { background: var(--ink); color: #fff; border-radius: 12px 12px 2px 12px; padding: 7px 11px; }
  .line.sys .text { color: var(--soft); font-size: 13px; }
  .line.err .text { color: var(--warn); font-size: 13px; }
  .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: flex-end; flex-wrap: wrap; }
  .composer textarea { flex: 1; min-width: 200px; resize: none; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
  .to { font-size: 12px; color: var(--soft); width: 100%; }
  .mic.rec { background: var(--warn); color: #fff; border-color: var(--warn); }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .muted { color: var(--soft); font-size: 13px; }
  .sum div { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  .sum small { display: block; color: var(--soft); font-size: 11.5px; }
  .card { border: 1.5px solid #cfcde6; border-radius: 12px; padding: 12px; background: #fcfcff; }
  .card .ver { font-size: 12px; color: var(--soft); }
  .card .title { font-size: 17px; font-weight: 700; margin: 2px 0 4px; }
  .versions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pile { background: #faf9f6; border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-height: 80px; }
  .pile h3 { font-size: 12px; margin: 0 0 6px; color: var(--soft); }
  .note { background: #fff6c9; border-radius: 6px; padding: 5px 7px; font-size: 12.5px; margin-bottom: 5px; }
  .pile.core .note { background: #ffe58a; font-weight: 600; }
  .pile.parked .note { background: #eee; color: var(--soft); }
  .rate .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; font-size: 13px; }
  .rate .dots { display: flex; gap: 3px; }
  .rate .dots button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 12px; }
  .rate .dots button.on { background: var(--ink); color: #fff; }
  .rate textarea { width: 100%; height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; font: inherit; font-size: 13px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(560px, 94vw); }
  dialog label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 7px 0; font-size: 14px; }
  dialog select { font: inherit; padding: 4px; border-radius: 6px; border: 1px solid var(--line); max-width: 60%; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } section { height: 80vh; } }
</style>
</head>
<body>
<header>
  <h1>Windups Lab</h1>
  <div class="chips" id="presets"></div>
  <button class="btn" id="settingsBtn">설정</button>
  <button class="btn" id="newBtn">새 세션</button>
</header>
<main>
  <section>
    <div class="hint" id="hint"></div>
    <div class="desk" id="desk"><div class="me">● 나</div></div>
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="to" id="to"></div>
      <textarea id="input" placeholder="아이디어나 고민을 편하게 말해 보세요 (Enter = 보내기, Shift+Enter = 줄바꿈)"></textarea>
      <button class="btn mic" id="mic" title="누르고 말한 뒤 다시 누르기">🎤</button>
      <button class="btn" id="continueBtn" hidden>계속 토론</button>
      <button class="btn primary" id="send">보내기</button>
    </div>
  </section>
  <aside>
    <div id="artifact"></div>
    <div class="rate" id="rate">
      <h2>이 버전 평가</h2>
      <div class="muted" style="margin-bottom:6px">몇 턴 써본 뒤 눌러 주세요. 대화 기록과 함께 WebLab/sessions에 저장돼요.</div>
      <div id="rateRows"></div>
      <textarea id="rateNote" placeholder="좋았던 점 / 별로였던 점 한 줄"></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn primary" id="rateSave">평가 저장</button><span class="muted" id="rateMsg"></span></div>
    </div>
  </aside>
</main>
<dialog id="settings">
  <h2>설정 (적용하면 새 세션)</h2>
  <div id="knobs"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="btn" id="settingsClose">닫기</button>
    <button class="btn primary" id="settingsApply">적용</button>
  </div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
